    upgrade-success: "%evolv3_prefix% &#00FFFF&l[Upgraded] &#FFFFFF%enchant_name% &#CCCCCCis now level &#FFFFFF%new_level%&#CCCCCC."
    max-level: "%evolv3_prefix% &#FFFFFF%enchant_name% &#CCCCCCis already at max level."
    all-maxed: "%evolv3_prefix% &#CCCCCCAll enchants are at maximum level."
    not-available: "%evolv3_prefix% &#CCCCCCThat enchant is not available."
    unlocked: "%evolv3_prefix% &#B366D9&l[Enchant Unlocked] &#FFFFFF%enchant_name%&#CCCCCC."
    not-unlocked: "%evolv3_prefix% &#FFFFFF%enchant_name% &#CCCCCChasn't been unlocked yet."
    no-spins: "%evolv3_prefix% &#CCCCCCNo Enchant Rolls available. Keep mining to earn one."
    area-secured: "%evolv3_prefix% &#00FFFFArea secured."
    access-denied: "%evolv3_prefix% &#CCCCCCYou can't use that here."
    confirm-selection: "%evolv3_prefix% &#00FFFFEnchant selected!"
    toggle-enabled: "%evolv3_prefix% &#00FF88✔ &#FFFFFF%enchant_name% &#CCCCCCenabled."
    toggle-disabled: "%evolv3_prefix% &#FF5555✗ &#FFFFFF%enchant_name% &#CCCCCCdisabled."

  menu:
