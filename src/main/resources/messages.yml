    title: "&#00FFFF&l⬆ Level Up"
    subtitle: "&#CCCCCCPickaxe is now level &#FFFFFF%level%"

  enchant:
    insufficient-essence: "  %evolv3_prefix% &#CCCCCCYou need &#B366D9🔥 &#FFFFFF%required_essence% &#B366D9Essence &#CCCCCCto upgrade &#FFFFFF%enchant_name%&#CCCCCC."
    upgrade-success: "  %evolv3_prefix% &#FFFFFF%enchant_name% &#CCCCCCis now level &#FFFFFF%new_level%&#CCCCCC."
    max-level: "  %evolv3_prefix% &#FFFFFF%enchant_name% &#CCCCCCis already at max level."
    all-maxed: "  %evolv3_prefix% &#CCCCCCAll enchants are at maximum level."
    not-available: "  %evolv3_prefix% &#CCCCCCThat enchant is not available."
    unlocked: "  %evolv3_prefix% &#B366D9&l[Enchant Unlocked] &#FFFFFF%enchant_name%&#CCCCCC."
    not-unlocked: "  %evolv3_prefix% &#FFFFFF%enchant_name% &#CCCCCChasn't been unlocked yet."
    no-spins: "  %evolv3_prefix% &#CCCCCCNo Enchant Rolls available. Keep mining to earn one."
    area-secured: "  %evolv3_prefix% &#00FFFFArea secured."
    access-denied: "  %evolv3_prefix% &#CCCCCCYou can't use that here."
    confirm-selection: "  %evolv3_prefix% &#00FFFFEnchant selected!"
    toggle-enabled: "  %evolv3_prefix% &#00FF88✔ &#FFFFFF%enchant_name% &#CCCCCCenabled."
    toggle-disabled: "  %evolv3_prefix% &#FF5555✗ &#FFFFFF%enchant_name% &#CCCCCCdisabled."

  menu:
    evolution-coming-soon: "  %evolv3_prefix% &#CCCCCC&oEvolution coming soon..."

  evolve:
    not-available: "  %evolv3_prefix% &#CCCCCCEvolution is not yet available."
    insufficient-spins: "  %evolv3_prefix% &#CCCCCCNot enough Evolution Rolls."
    success: "  %evolv3_prefix% &#FFD700&l[Evolution Roll] &#CCCCCCYou earned an Evolution Roll!"
    result:
      - ""
      - "  &b⛏ &b&l EVOLUTION %evolution_level%"
      - "  &#888888Your pickaxe has ascended to %tier%&#888888."
      - ""
      - "  &#FFFFFF&lRewards"
      - "  &#B366D9🔥 &#B366D9+%essence% &#B366D9Essence"
      - "  %stone_color%✦ %stone_color%+1 %stone_rarity% Evolution Stone"
      - ""

  prestige:
    # Action bar shown while mining when prestige is available
    action-bar: "&#55FF55&lPRESTIGE AVAILABLE &#888888(Shift+Right-Click)"
    # Lore line displayed on the pickaxe when prestige > 0 (shown in Statistics section)
    lore-line: " &8| &#FFD700✪ &#FFD700&lPrestige %prestige% &#888888(x%multiplier%)"
    # Scoreboard line displayed when prestige > 0
    scoreboard-line: " &8| &#FFD700✪ &#FFD700Prestige %prestige%"
    # Broadcast/chat messages shown after a successful prestige
    success:
      - ""
      - "  &#FFD700✪ &lPrestige &F&l%prestige_number%"
      - "  &#888888Your pickaxe has transcended."
      - ""
      - "  &#FFFFFF&lRewards"
      - "  &#FFFFFF+1 &#888888Evolution Stone Socket"
      - "  &#B366D9🔥 &8& &#FFEE00⚛ &#888888Multiplier &#FFFFFFx%multiplier%"
      - "  %stone_color%%stone_color%+1 %stone_rarity% Evolution Stone"
      - ""
    # Message shown when the stone from prestige is delivered to inventory
    stone-gained: "  %evolv3_prefix% &#CCCCCCYou received a &#%rarity_color%%rarity% &#CCCCCCEvolution Stone!"
    # Confirmation GUI title
    confirm-title: "&8Confirm Prestige"
    # Stone selection GUI title
    stone-select-title: "&f&l✪ Choose Your Stone"
    # Shown when player is already at max prestige
    already-max: "  %evolv3_prefix% &#CCCCCCYour pickaxe is already at maximum prestige."
    # Shown when player tries to prestige without meeting the level requirement
    not-eligible: "  %evolv3_prefix% &#CCCCCCYour pickaxe must reach level &#FFFFFF%required_level% &#CCCCCCto prestige."
    # Shown when prestige data couldn't be loaded
    error: "  %evolv3_prefix% &cFailed to process prestige. Please try again."

