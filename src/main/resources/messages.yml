# =====================================================
# Evolv3 Messages Configuration
# =====================================================
# Color guide:
#   &#00FFFF  — cyan theme (accent, labels)
#   &#CCCCCC  — body text
#   &#FFFFFF  — values / highlights
#   &#FFD700  — coins / economy
#   &#B366D9  — essence / purple
#   &#FFEE00  — atoms / evolution (gold)
#   &a        — success green
#   &c        — error red
#   &8        — dark gray (prefix brackets, pipes)
#
# Prefix placeholder: %evolv3_prefix%
# =====================================================
prefix: "&3&lE &8➧ "

# =====================================================
# Join Message
# =====================================================
join-message:
  enabled: true
  skin-padding: "  "
  lines:
    - ""
    - "  &#00FFFF&lWelcome back, &#FFFFFF&l%evolv3_player_name%"
    - "  &#888888Good to see you again."
    - ""
    - "  &#B366D9Essence 🔥 %evolv3_player_essence%"
    - "  &#FFEE00Atoms ⚛ %evolv3_pickaxe_evolution_atoms%"
    - "  &#FFD700Coins ⛁ %evolv3_player_coins%"
    - ""
  first-join-lines:
    - ""
    - "  &#00FFFF&lWelcome, &#FFFFFF&l%evolv3_player_name%"
    - "  &#888888Your mining journey begins now."
    - ""
    - "  &#CCCCCCUse &#FFFFFF/pickaxe &#CCCCCCto claim your first pickaxe."
    - "  &#CCCCCCMine blocks to level up and unlock enchants."
    - ""

general:
  no-permission: "  %evolv3_prefix% &#CCCCCCYou don't have permission to do that."
  player-only: "  %evolv3_prefix% &#CCCCCCThis command can only be used in-game."
  unknown-command: "  %evolv3_prefix% &#CCCCCCUnknown command."
  reload-success: "  %evolv3_prefix% &#00FFFFReload complete."
  reload-failed: "  %evolv3_prefix% &cReload failed. Check the console for details."

errors:
  database-error: "  %evolv3_prefix% &cA database error occurred. Please try again."
  internal-error: "  %evolv3_prefix% &cSomething went wrong. Please try again."
  invalid-arguments: "  %evolv3_prefix% &cInvalid usage: &#CCCCCC%usage%"
  menu-not-found: "  %evolv3_prefix% &cMenu not found: &#CCCCCC%menu%"

# =====================================================
# Pickaxe Messages
# =====================================================
pickaxe:
  loading-profile: "  Loading pickaxe profile..."
  profile-created: "  %evolv3_prefix% &#00FFFFPickaxe profile created."
  no-pickaxe: "  %evolv3_prefix% &#CCCCCCYou don't have a pickaxe in storage."
  enchant-roll-gained: "  %evolv3_prefix% &#B366D9&l[Enchant Roll] &#CCCCCCYou earned an Enchant Roll!"
  pickaxe-broken: "  &#FF4444Your pickaxe has broken and been removed from storage."
  drop-confirmation:
    - ""
    - "  &#FF4444⚠ &lConfirm Drop"
    - "  &#CCCCCCDropping your {tool} will release your ownership."
    - "  &#FFFFFFPress Q again &#CCCCCCwithin 5 seconds to confirm."
    - ""
  pickup-new-owner: "  &#00FFFFYou picked up a pickaxe!"
  dropped-display-text: "&b⛏ &f&lLevel %level%  &7XP &f%xp%/%target%"
  durability-warning:
    - ""
    - "  &#FF4444⚠ &lPickaxe Durability Critical"
    - "  &#CCCCCCYour pickaxe is close to breaking."
    - "  &#CCCCCCMine &#FFFFFF&lLogs &#CCCCCCto collect &#E8890A&lAncient Resin&#CCCCCC, "
    - "  &#CCCCCCthen repair using &#FFFFFF/pick&#CCCCCC."
    - ""

  level-up:
    - ""
    - "  &#00FFFF⛏ &lPickaxe &F&lLevel %level%"
    - "  &#888888Your pickaxe grows stronger."
    - ""
    - "  &#FFFFFF&lRewards"
    - "  &#B366D9🔥 &#FFFFFF+%essence% &#B366D9Essence"
    - "  &#FFEE00⚛ &#FFFFFF+%atoms% &#FFEE00Atoms"
    - ""

