# =====================================================
# Evolv3 - Messages Configuration
# =====================================================
# All player-facing messages for the plugin.
# Supports PlaceholderAPI placeholders and color codes.
# Use & for color codes (e.g., &a for green, &c for red)
# =====================================================

# Pickaxe Profile Messages
pickaxe:
  loading-profile: "&aLoading your pickaxe profile..."
  profile-created: "&aPickaxe profile created!"
  profile-saved: "&aPickaxe profile saved!"
  no-pickaxe: "&cYou must be holding a pickaxe!"

# General Messages
general:
  prefix: "&8[&6Evolv3&8]&r "
  no-permission: "&cYou don't have permission to do that!"
  player-only: "&cThis command can only be used by players!"
  unknown-command: "&cUnknown command. Use /help for a list of commands."
  reload-success: "&aConfiguration reloaded successfully!"
  reload-failed: "&cFailed to reload configuration. Check console for errors."

# Error Messages
errors:
  database-error: "&cA database error occurred. Please contact an administrator."
  internal-error: "&cAn internal error occurred. Please try again later."
  invalid-arguments: "&cInvalid arguments. Usage: %usage%"

# Animation Messages
animation:
  budget-exceeded: "&cAnimation skipped - server is busy!"

# Enchantment Messages
enchants:
  explosive:
    triggered: "&6&l[Explosive] &eLevel %level% explosion! Broke %blocks% blocks!"

# Pickup Animation Messages
pickup-animation:
  # Current animation display
  current-header: "&6&l[Pickup Animation]"
  current: "&7Current: &a%name% &8- &7%description%"
  hint: "&7Use &e/pa list &7to see all options, or &e/pa next &7to cycle."

  # Animation list
  list-header: "&6&l[Available Pickup Animations]"
  list-item: " &8> &e%name% &8- &7%description%"
  list-item-selected: " &a> &b%name% &8- &7%description% &a(selected)"
  list-footer: "&7Use &e/pa set <name> &7to select an animation."

  # Set animation
  set-success: "&aPickup animation set to: &b%name%"
  invalid-animation: "&cInvalid animation: %name%. Use /pa list to see available options."
  usage-set: "&cUsage: /pickupanimation set <animation>"

  # Cycle animation
  cycled: "&aSwitched to: &b%name% &8- &7%description%"

  # Toggle others' animations
  others-enabled: "&aYou can now see other players' pickup animations."
  others-disabled: "&cYou will no longer see other players' pickup animations."

  # Errors
  unknown-subcommand: "&cUnknown option. Use: list, set <animation>, next, or others"

# Enchant Selection Messages
enchant-selection:
  # Starting selection
  started: "&aLook at an enchant and &e&lLEFT-CLICK &ato select!"
  already-active: "&cYou already have an enchant selection active!"
  no-item: "&cYou must be holding an item to enchant!"
  budget-exceeded: "&cCould not start enchant selection (server is busy)!"

  # Selection made
  selected: "&a&l[Enchanted!] &eYou selected: &b%enchant%"

  # Hint displayed during selection
  hint: "&e&lLook at an enchant and &a&lLEFT-CLICK &e&lto select!"

  # Timeout
  timeout: "&cEnchant selection timed out. Please try again."

  # Cancelled
  cancelled: "&cEnchant selection cancelled."
