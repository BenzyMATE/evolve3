  # Mine info hologram — each line is a separate line of the TextDisplay.
  # Placeholders: %mine%, %icon%, %remaining%, %reset_time%, %players%, %caves_discovered%, %caves_total%
  # %icon% is replaced by the per-mine icon (or defaults.hologram-icon from mines.yml).
  hologram-template:
    - "%name_color%&l%icon% %mine%"
    - ""
    - "&#888888Remaining  &#FFFFFF%remaining%%"
    - "&#888888Reset  &#FFFFFF%reset_time%"
    - "&#888888Miners  &#FFFFFF%players%"
    - "&#888888Caves  &#FFFFFF%caves_discovered%&#888888/&#FFFFFF%caves_total%"
    - ""
    - "&#444444▼"

