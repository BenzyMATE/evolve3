# =====================================================
# Evolv3 Messages Configuration
# =====================================================
# Color guide:
#   &#00FFFF  — cyan theme (accent, labels)
#   &#CCCCCC  — body text
#   &#FFFFFF  — values / highlights
#   &#FFD700  — coins / economy
#   &#B366D9  — essence / purple
#   &#FFEE00  — atoms / evolution (gold)
#   &a        — success green
#   &c        — error red
#   &8        — dark gray (prefix brackets, pipes)
#
# Prefix placeholder: %evolv3_prefix%
# =====================================================
prefix: "&3&lE &8➧ "

# =====================================================
# Join Message
# =====================================================
# Displays when a player joins. The player's 8×8 skin face
# is shown on the left; the 8 lines below appear to the right.
# Supports color codes (&/&#RRGGBB) and PlaceholderAPI.
# skin-padding: spaces prepended to the left of the skin (indentation).
# Exactly 8 lines — use "" for an empty row.
# =====================================================
join-message:
  enabled: true
  skin-padding: "  "
  lines:
    - ""
    - "&#00FFFF&lWelcome back, &#FFFFFF&l%evolv3_player_name%"
    - "&#888888Good to see you again."
    - ""
    - "&#B366D9Essence 🔥 %evolv3_player_essence%"
    - "&#FFEE00Atoms ⚛ %evolv3_pickaxe_evolution_atoms%"
    - "&#FFD700Coins ⛁ %evolv3_player_coins%"
    - ""

general:
  no-permission: "%evolv3_prefix% &#CCCCCCYou don't have permission to do that."
  player-only: "%evolv3_prefix% &#CCCCCCThis command can only be used in-game."
  unknown-command: "%evolv3_prefix% &#CCCCCCUnknown command."
  reload-success: "%evolv3_prefix% &#00FFFFReload complete."
  reload-failed: "%evolv3_prefix% &cReload failed. Check the console for details."

errors:
  database-error: "%evolv3_prefix% &cA database error occurred. Please try again."
  internal-error: "%evolv3_prefix% &cSomething went wrong. Please try again."
  invalid-arguments: "%evolv3_prefix% &cInvalid usage: &#CCCCCC%usage%"

# =====================================================
# Pickaxe Messages
# =====================================================
pickaxe:
  loading-profile: "Loading pickaxe profile..."
