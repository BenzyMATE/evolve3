# =====================================================
# Evolv3 - Prison Zone Border Walls
# =====================================================
# Use /border wand then /border set <rankId> in-game.
#
# Each wall is keyed by the rank ID required to cross it.
#   B1 → blocks players below rank B1 from entering the B zone
#   C1 → blocks players below rank C1 from entering the C zone
#
# A wall is a line segment defined by two XZ points (spanning all Y heights).
# Players who move across the wall line are pushed back until they rank up.
#
# max-borders-per-rank: Maximum border walls allowed per rank.
#   Set to 2 because some zone blocks have two entrances.
#   Increase this value if a zone has more entrances.
#
# Wall slots are numbered starting at 1.
#   /border set <rankId>         → adds to the next available slot
#   /border remove <rankId>      → removes all walls for that rank
#   /border remove <rankId> <n>  → removes wall at slot n
#
# x1 / z1 : First endpoint of the wall
# x2 / z2 : Second endpoint of the wall
# =====================================================

max-borders-per-rank: 2

borders: {}
