# =====================================================
# Evolv3 - Prison Rank Configuration
# =====================================================
# Prison blocks: A → B → C → D → E → F (4 sub-ranks each)
# Staff ranks: Helper → Moderator → Admin → Owner
#
# Cost: coins required to rankup TO this rank (0 = starting rank)
# Prefix: color-formatted tag shown in chat/scoreboard
# ChatColor: color applied to the player's name in chat
# Block: the prison block this rank belongs to
# Permissions: extra permissions granted whenMake the players name gray  reaching this rank
#
# Block colors:
#   A → Red    (&c)
#   B → Yellow (&e)
#   C → Green  (&a)
#   D → Orange (&6)
#   E → Blue   (&9)
#   F → Pink   (&d)
# =====================================================

Ranks:
  DefaultRank: "A1"

  # Defines the exact progression order (lowest → highest)
  Order:
    - A1
    - A2
    - A3
    - A4
    - B1
    - B2
    - B3
    - B4
    - C1
    - C2
    - C3
    - C4
    - D1
    - D2
    - D3
    - D4
    - E1
    - E2
    - E3
    - E4
    - F1
    - F2
    - F3
    - F4

  Data:

    # ─────────────────────── A Block (Red) ───────────────────────
    A1:
      Cost: 0
      Prefix: "&c[A1]"
      ChatColor: "&c"
      Block: "A"
      Permissions: []

    A2:
      Cost: 500
      Prefix: "&c[A2]"
      ChatColor: "&c"
      Block: "A"
      Permissions: []

    A3:
      Cost: 1500
      Prefix: "&c[A3]"
      ChatColor: "&c"
      Block: "A"
      Permissions: []

    A4:
      Cost: 4000
      Prefix: "&c[A4]"
      ChatColor: "&c"
      Block: "A"
      Permissions: []

    # ─────────────────────── B Block (Yellow) ───────────────────────
