# =====================================================
# Staff Rank Configuration
# =====================================================
StaffRanks:
  Order:
    - helper
    - moderator
    - admin
    - owner

  Data:
    helper:
      Prefix: "&a&lHELPER"
      ChatColor: "&a"
      Permissions:
        - "evolv3.staff"
        - "evolv3.staff.helper"

    moderator:
      Prefix: "&bMOD"
      ChatColor: "&b"
      Permissions:
        - "evolv3.staff"
        - "evolv3.staff.helper"
        - "evolv3.staff.moderator"

    admin:
      Prefix: "&6&lADMIN"
      ChatColor: "&6"
      Permissions:
        - "evolv3.staff"
        - "evolv3.staff.helper"
        - "evolv3.staff.moderator"
        - "evolv3.staff.admin"
        - "evolv3.rank.setrank"
        - "evolv3.rank.setstaff"

    owner:
      Prefix: "&c&lOWNER"
      ChatColor: "&c"
      Permissions:
        - "evolv3.staff"
        - "evolv3.staff.helper"
        - "evolv3.staff.moderator"
        - "evolv3.staff.admin"
        - "evolv3.staff.owner"
        - "evolv3.rank.setrank"
        - "evolv3.rank.setstaff"
        - "*"

# =====================================================
# Rankup Messages
# =====================================================
Messages:
  Rankup:
    Success: "&#55FF55&lRANK UP! &#CCCCCCYou are now rank %rank%&#CCCCCC!"
    Insufficient: "&#FF5555&lInsufficient Coins! &#CCCCCCYou need &#FFD700&l%cost% &#FFD700⛁ &#CCCCCCto rank up to %rank%&#CCCCCC."
    AtMaxRank: "&dYou are already at the highest rank &d&l[F4]&d!"

  SetRank:
    Success: "&#55FF55Set &#FFFFFF%player%&#55FF55's rank to %rank%&#55FF55."
    PlayerNotified: "&#55FF55Your rank has been set to %rank% &#55FF55by an admin."

  SetStaff:
    Success: "&#55FF55Set &#FFFFFF%player%&#55FF55's staff rank to &#FFFFFF%rank%&#55FF55."
    Cleared: "&#55FF55Cleared &#FFFFFF%player%&#55FF55's staff rank."
    PlayerNotified: "&#55FF55Your staff rank has been set to &#FFFFFF%rank%&#55FF55 by an admin."
    PlayerCleared: "&#CCCCCCYour staff rank has been removed by an admin."
