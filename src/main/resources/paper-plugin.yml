name: Evolv3
version: '1.0-SNAPSHOT'
main: org.benski.evolv3.Main
bootstrapper: org.benski.evolv3.Bootstrap
api-version: '26.1'

dependencies:
  server:
    PlaceholderAPI:
      load: BEFORE
      required: false
    Vault:
      load: BEFORE
      required: false
    WorldGuard:
      load: BEFORE
      required: false
    WorldEdit:
      load: BEFORE
      required: false

commands:
  evolv3:
    description: Main admin command for Evolv3
    usage: /<command> <help|reload|info|mine|border|beam|launchpad|rank|...>
    aliases: [ev3, e3, e]
    permission: evolv3.admin
  pickaxe:
    description: Opens the pickaxe management menu
    usage: /<command>
    aliases: [pick, p]
  backpack:
    description: Opens your backpack inventory
    usage: /<command>
    aliases: [bp, bag]
  preferences:
    description: Manage your personal preferences
    usage: /<command> [setting] [value]
    aliases: [prefs, settings]
  pickupanimation:
    description: Manage pickup animations
    usage: /<command> <list|set|next|others>
    aliases: [pa]
  bal:
    description: View your coin balance
    usage: /<command> [player]
    aliases: [balance, coins, money]
  enchantpickaxe:
    description: Admin command to set a custom enchant on your held pickaxe
    usage: /<command> <enchant> <level>
    aliases: [epickaxe, ep]
    permission: evolv3.admin
  cell:
    description: Manage your rented cell
    usage: /<command> [rent|list|tp|leave|member]
  island:
    description: Manage your island
    usage: /<command> [tp|lock|visits|member]
    aliases: [islands]
  test:
    description: Test command
    usage: /<command>
