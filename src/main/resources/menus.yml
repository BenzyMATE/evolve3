# =====================================================
# Action Types Reference:
# =====================================================
# - close                    - Closes the menu
# - sound:SOUND_NAME         - Plays a sound
# - message:&aHello!         - Sends a message
# - command:help             - Makes player run command
# - custom:action_name       - Calls handleCustomAction() in your menu class
# =====================================================

# =====================================================
# Slot Configurations:
# =====================================================
# - "border"       - All edge slots
# - "all"          - All slots in menu
# - "0-8"          - Range from slot 0 to 8
# - "0,4,8"        - Specific slots
# - "0-8,18-26"    - Multiple ranges/slots (comma separated)
# =====================================================

# =====================================================
# Item Properties:
# =====================================================
# material: MATERIAL_NAME   (required)
# name: "&aName"            (optional)
# lore:                     (optional)
#   - "&7Line 1"
#   - "&7Line 2"
# amount: 1                 (optional, default: 1)
# glow: true                (optional, default: false)
# action: "action_type"     (optional)
# =====================================================
