# =====================================================
# Evolv3 - Menus Configuration
# =====================================================
# Configure your menus here using ConfigurableMenu.
# Supports color codes (&) and dynamic placeholders.
# =====================================================

# Example configuration menu
example_config_menu:
  title: "&f七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七⒑"
  size: 54  # Must be multiple of 9 (9, 18, 27, 36, 45, 54)

  # Define items by slot number
  items:
    # Info button (slot 10)
    10:
      material: BOOK
      name: "&e&lInformation"
      lore:
        - "&7Click to view info about"
        - "&7this configurable menu system"
      glow: true
      action: "custom:info"

# Profile menu example
profile_menu:
  title: "&6&lYour Profile"
  size: 54

  items:
    # Player head (slot 4)
    4:
      material: PLAYER_HEAD
      name: "&e&l%player_name%"
      lore:
        - "&7Rank: &f%player_rank%"
        - "&7Level: &f%player_level%"
        - ""
        - "&7Click to view statistics"
      action: "custom:view_stats"

    # Stats button (slot 20)
    20:
      material: DIAMOND_SWORD
      name: "&b&lCombat Stats"
      lore:
        - "&7Kills: &f%player_kills%"
        - "&7Deaths: &f%player_deaths%"
        - "&7K/D Ratio: &f%player_kd%"
      action: "custom:combat_stats"

    # Settings button (slot 24)
    24:
      material: COMPARATOR
      name: "&e&lSettings"
      lore:
        - "&7Click to change your"
        - "&7personal settings"
      action: "custom:open_settings"

    # Close button (slot 49)
    49:
      material: BARRIER
      name: "&c&lClose"
      action: "close"

  fill:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    slots: "0-8,45-53,9,17,18,26,27,35,36,44"

# Backpack Menu
Backpack Menu:
  Title: "&8Backpack"
  TitlePaged: "&8Backpack &7(Page %page%/%total%)"

# Pickaxe Menu panel items
# All text is automatically converted to small-caps via FontUtils in the formatMessage pipeline.
Pickaxe Menu:
  Essence:
    Name: "&#B366D9🔥 &#FFFFFF&l%evolv3_player_name% &#B366D9Enchant"
    Lore:
      - ''
      - ' &#FFFFFF&lDescription'
      - ' &8| &#CCCCCCMine blocks to build up &#B366D9Essence&#CCCCCC.'
      - ' &8| &#CCCCCCOnce your threshold is reached'
      - ' &8| &#CCCCCCyou earn an &#00FFFFEnchant Roll&#CCCCCC,'
      - ' &8| &#CCCCCCwhich can be spent to unlock or'
      - ' &8| &#CCCCCCupgrade enchantments.'
      - ''
      - ' &#FFFFFF&lStatistics'
      - ' &8| &#B366D9Essence: 🔥 &#FFFFFF%evolv3_pickaxe_essence%&#888888/&#FFFFFF%evolv3_pickaxe_target_essence%'
      - ' &8| &#B366D9Enchant Rolls: &#00FFFF%evolv3_pickaxe_enchant_rolls%'
      - ' &8| &#B366D9Progress: &#00FF88%evolv3_pickaxe_essence_percentage%'
      - ' &8| %evolv3_pickaxe_essence_progressbar%'
      - ''
      - ' &8| &aLeft-Click &#AAAAAAto roll for enchantments '
      - ''
  StorageAction: " &8| &aLeft-Click &#AAAAAAto open pickaxe storage"
  RepairAction: " &8| &#FFEE00Right-Click &#AAAAAAto repair &#777777(&#E8890A5 &#777777Ancient Resin)"
  Stones:
    Header: " &#FFFFFF&lStones"
    FilledLine: " &8| &#{hex}{effect}"
    EmptyLine: " &8| &#333333Empty Socket"
    ActionLine: " &8| &aShift+Right-Click &#AAAAAAto manage stones."
  LockedEnchant:
    Name: "&8&l⬡ &#666666Locked Enchant"
    Lore:
      - ' &#444444Locked'
      - ''
      - ' &#FFFFFF&lDescription'
      - ' &8| &#777777This enchant slot has not been unlocked.'
      - ' &8| &#777777Roll for enchants to discover new'
      - ' &8| &#777777abilities for your pickaxe.'
      - ''
      - ' &8| &#555555Use the &#B366D9Enchant Panel &#555555to roll.'
      - ''
  Evolve:
    Name: "&#FFEE00⚛ &#FFFFFF&l%evolv3_player_name% &#FFEE00Evolution"
    Lore:
      - ''
      - ' &#FFFFFF&lDescription'
      - ' &8| &#CCCCCCRare &#FFEE00Atoms&#CCCCCC surface as you break'
      - ' &8| &#CCCCCCblocks. Fill the meter to earn'
      - ' &8| &#CCCCCCan &#00FFFFEvolution Roll&#CCCCCC, then spend'
      - ' &8| &#CCCCCCit to push your pickaxe to the'
      - ' &8| &#CCCCCCnext stage.'
      - ''
      - ' &#FFFFFF&lStatistics'
      - ' &8| &#FFEE00Atoms: ⚛ &#FFFFFF%evolv3_pickaxe_evolution_atoms%&#888888/&#FFFFFF%evolv3_pickaxe_atom_target%'
      - ' &8| &#FFEE00Evolution Rolls: &#00FFFF%evolv3_pickaxe_evolution_rolls%'
      - ' &8| &#FFEE00Progress: &#00FF88%evolv3_pickaxe_atom_percentage%'
      - ' &8| %evolv3_pickaxe_atom_progressbar%'
      - ''
      - ' &8| &aLeft-Click &#AAAAAAto evolve your pickaxe '
      - ''

# Pickaxe Limit Menu slot items
# Tokens: {cost}, {wood}, {slot}, {amount_colored}
Pickaxe Limit Menu:
  Title: "&8Pickaxe Storage"
  ClaimSlot:
    Name: "&#00FFFF⛏ &#FFFFFF&lClaim Pickaxe"
    Lore:
      - ''
      - ' &#FFFFFF&lBegin Your Journey'
      - ' &8| &#CCCCCCEvery great miner starts here.'
      - ' &8| &#CCCCCCClaim your pickaxe and descend'
      - ' &8| &#CCCCCCinto the depths. Mine, evolve,'
      - ' &8| &#CCCCCCand forge a legacy in stone.'
      - ''
      - ' &8| &aLeft-Click &#AAAAAAto claim'
      - ''
  BlockedSlot:
    Name: "&#FF4444⬡ &#FFFFFF&lSlot Blocked"
    Lore:
      - ''
      - ' &#FFFFFF&lBlocked'
      - ' &8| &#CCCCCCYou already have an active pickaxe.'
      - ' &8| &#CCCCCCDeposit it first to claim this slot.'
      - ''
  LockedSlot:
    Name: "&#666666⬡ &#666666Locked Slot"
    Lore:
      - ' &#444444Locked'
      - ''
      - ' &#FFFFFF&lDescription'
      - ' &8| &#CCCCCCPurchase to unlock this storage slot.'
      - ''
      - ' &#FFFFFF&lRequirements'
      - ' &8| &#888888Cost: &#FFFFFF{cost} {wood}'
      - ''
  ActiveSlot:
    Name: "&#00FFFF⛏ &#FFFFFF&lPickaxe &#00FF88(Active)"
  PurchaseButton:
    NameAffordable: "&#00FFFF⬡ &#FFFFFF&lUnlock Slot {slot}"
    NameTooExpensive: "&#FF5555⬡ &#FFFFFF&lInsufficient Resources"
    Lore:
      - ''
      - ' &#FFFFFF&lRequirements'
      - ' &8| &#888888Next Slot: &#FFFFFF{slot}'
      - ' &8| &#888888Cost: &#FFFFFF{cost} {wood}'
      - ' &8| &#888888You Have: {amount_colored}'
      - ''
    ActionAffordable: " &8| &aLeft-Click &#AAAAAAto unlock"
    ActionTooExpensive: " &8| &#FF5555Not enough {wood}"
  MaxedButton:
    Name: "&#00FFFF★ &#FFFFFF&lAll Slots Unlocked"
    Lore:
      - ''
      - ' &#FFFFFF&lStatus'
      - ' &8| &#00FF88All pickaxe storage slots are unlocked!'
      - ''

