# =====================================================
# Evolv3 - Menus Configuration
# =====================================================
# Configure your menus here using ConfigurableMenu.
# Supports color codes (&) and dynamic placeholders.
# =====================================================

# Example configuration menu
example_config_menu:
  title: "&f七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七七⒑"
  size: 54  # Must be multiple of 9 (9, 18, 27, 36, 45, 54)

  # Define items by slot number
  items:
    # Info button (slot 10)
    10:
      material: BOOK
      name: "&e&lInformation"
      lore:
        - "&7Click to view info about"
        - "&7this configurable menu system"
      glow: true
      action: "custom:info"

# Profile menu example
profile_menu:
  title: "&6&lYour Profile"
  size: 54

  items:
    # Player head (slot 4)
    4:
      material: PLAYER_HEAD
      name: "&e&l%player_name%"
      lore:
        - "&7Rank: &f%player_rank%"
        - "&7Level: &f%player_level%"
        - ""
        - "&7Click to view statistics"
      action: "custom:view_stats"

    # Stats button (slot 20)
    20:
      material: DIAMOND_SWORD
      name: "&b&lCombat Stats"
      lore:
        - "&7Kills: &f%player_kills%"
        - "&7Deaths: &f%player_deaths%"
        - "&7K/D Ratio: &f%player_kd%"
      action: "custom:combat_stats"

    # Settings button (slot 24)
    24:
      material: COMPARATOR
      name: "&e&lSettings"
      lore:
        - "&7Click to change your"
        - "&7personal settings"
      action: "custom:open_settings"

    # Close button (slot 49)
    49:
      material: BARRIER
      name: "&c&lClose"
      action: "close"

  fill:
    enabled: true
    material: BLACK_STAINED_GLASS_PANE
    name: " "
    slots: "0-8,45-53,9,17,18,26,27,35,36,44"

