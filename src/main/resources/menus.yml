  TitlePaged: "&8Backpack &7(Page %page%/%total%)"

# Pickaxe Menu panel items
# All text is automatically converted to small-caps via FontUtils in the formatMessage pipeline.
Pickaxe Menu:
  Essence:
    Name: "&#B366D9🔥 &#FFFFFF&l%evolv3_player_name% &#B366D9Enchant"
    Lore:
      - ''
      - ' &#FFFFFF&lDescription'
      - ' &8| &#CCCCCCMine blocks to build up &#B366D9Essence&#CCCCCC.'
      - ' &8| &#CCCCCCOnce your threshold is reached'
      - ' &8| &#CCCCCCyou earn an &#00FFFFEnchant Roll&#CCCCCC,'
      - ' &8| &#CCCCCCwhich can be spent to unlock or'
      - ' &8| &#CCCCCCupgrade enchantments.'
      - ''
      - ' &#FFFFFF&lStatistics'
      - ' &8| &#B366D9Essence: 🔥 &#FFFFFF%evolv3_pickaxe_essence%&#888888/&#FFFFFF%evolv3_pickaxe_target_essence%'
      - ' &8| &#B366D9Enchant Rolls: &#00FFFF%evolv3_pickaxe_enchant_rolls%'
      - ' &8| &#B366D9Progress: &#00FF88%evolv3_pickaxe_essence_percentage%'
      - ' &8| %evolv3_pickaxe_essence_progressbar%'
      - ''
      - ' &8| &aLeft-Click &#AAAAAAto roll for enchantments '
      - ''
  StorageAction: " &8| &aLeft-Click &#AAAAAAto open pickaxe storage"
  RepairAction: " &8| &#FFEE00Right-Click &#AAAAAAto repair &#777777(&#E8890A5 &#777777Ancient Resin)"
  Stones:
    Header: " &#FFFFFF&lStones"
    FilledLine: " &8| &#{hex}{effect}"
    EmptyLine: " &8| &#333333Empty Socket"
    ActionLine: " &8| &aShift+Right-Click &#AAAAAAto manage stones."
  LockedEnchant:
    Name: "&8&l⬡ &#666666Locked Enchant"
    Lore:
      - ' &#444444Locked'
      - ''
      - ' &#FFFFFF&lDescription'
      - ' &8| &#777777This enchant slot has not been unlocked.'
      - ' &8| &#777777Roll for enchants to discover new'
      - ' &8| &#777777abilities for your pickaxe.'
      - ''
      - ' &8| &#555555Use the &#B366D9Enchant Panel &#555555to roll.'
      - ''
  Evolve:
    Name: "&#FFEE00⚛ &#FFFFFF&l%evolv3_player_name% &#FFEE00Evolution"
    Lore:
      - ''
      - ' &#FFFFFF&lDescription'
      - ' &8| &#CCCCCCRare &#FFEE00Atoms&#CCCCCC surface as you break'
      - ' &8| &#CCCCCCblocks. Fill the meter to earn'
      - ' &8| &#CCCCCCan &#00FFFFEvolution Roll&#CCCCCC, then spend'
      - ' &8| &#CCCCCCit to push your pickaxe to the'
      - ' &8| &#CCCCCCnext stage.'
      - ''
      - ' &#FFFFFF&lStatistics'
      - ' &8| &#FFEE00Atoms: ⚛ &#FFFFFF%evolv3_pickaxe_evolution_atoms%&#888888/&#FFFFFF%evolv3_pickaxe_atom_target%'
      - ' &8| &#FFEE00Evolution Rolls: &#00FFFF%evolv3_pickaxe_evolution_rolls%'
