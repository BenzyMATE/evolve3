# =====================================================
# Evolv3 - Enchantments Configuration
# =====================================================
# All enchantment settings including levels, chances,
# and conversion recipes. Configure enchant behaviour here.
# =====================================================

# =====================================================
# Rarity Tiers
# =====================================================
# Defines the five rarity tiers used by the enchant selection animation.
# Each tier specifies:
#   Item   - the concrete block colour used in the CS:GO-style strip
#   Color  - hex text/particle colour displayed during the animation
#   Chance - relative weight for the weighted-random rarity roll
Rarities:
  Common:
    Item: WHITE_CONCRETE
    Color: "#F0F0F0"
    Chance: 40
  Uncommon:
    Item: LIME_CONCRETE
    Color: "#55FF55"
    Chance: 30
  Rare:
    Item: LIGHT_BLUE_CONCRETE
    Color: "#00FFFF"
    Chance: 20
  Epic:
    Item: PURPLE_CONCRETE
    Color: "#FF55CC"
    Chance: 8
  Legendary:
    Item: ORANGE_CONCRETE
    Color: "#FFAA00"
    Chance: 2

# =====================================================
# Enchant Selection Pool
# =====================================================
# Lists every enchant available in the selection animation.
# Format: <ConfigKey>: <Rarity>
# ConfigKey must match a top-level enchant definition section below.
# To remove an enchant from the pool, simply delete its entry here.
SelectionPool:
  Efficiency: Common
  Unbreaking: Common
  Alchemy: Common
  Frostbite: Common
  Furnace: Uncommon
  Scavenger: Uncommon
  Merchant: Uncommon

# Display text when pickaxe has no enchants
NoEnchants: "&cNone"

# Display text when enchant is at max level
MaxEnchant: "&6&lMAX"

# =====================================================
# Enchant Definitions
# =====================================================
# Each section corresponds to a SelectionPool entry and defines both
# display data (used in the animation and pickaxe menu) and
# behaviour configuration specific to that enchant.
#
# Display fields:
#   Name      - plain display name (no colour codes — rarity colour is applied automatically)
#   Item      - fallback material icon if no Texture is set
#   MaxLevel  - maximum level this enchant can reach
#   MaxChance - maximum trigger chance at max level (0 = passive/always active)
#   Cost      - essence cost per level (actual cost = Cost × currentLevel)
#   Texture   - skull texture URL (textures.minecraft.net). Leave empty to use Item icon.
#   Lore      - item lore shown in the pickaxe menu. Supports tokens:
#                 {rarity}   → coloured rarity name
#                 {level}    → current level
#                 {maxLevel} → maximum level
#                 {cost}     → essence cost for next upgrade
#                 {chance}   → current trigger chance (%)

# =====================================================
# Unbreaking Enchantment (Passive)
# =====================================================
# Each level gives a percentage chance to negate durability damage when mining.
# Chance = (level / MaxLevel) * MaxChance
Unbreaking:
  Name: "Unbreaking"
  Description: "Reduces pickaxe durability damage."
  Passive: true
  MaxLevel: 100
  MaxChance: 75
  Cost: 15
  Item: ANVIL
  Texture: "http://textures.minecraft.net/texture/54a01c2b4cc9e2652e8b990651f0a27f0c8b5b3c72d1026f2b7b19ca2f4e5"
  Lore:
    - ' {rarity}'
    - ''
    - ' &#FFFFFF&lDescription'
    - ' &8| &#CCCCCCPassively reduces the chance of'
    - ' &8| &#CCCCCCyour pickaxe taking durability damage.'
    - ''
    - ' &#FFFFFF&lStatistics'
    - ' &8| &#888888Level: &#FFFFFF{level}&#888888/&#FFFFFF{maxLevel}'
    - ' &8| &#888888Cost: &#B366D9🔥 &#B366D9{cost}'
    - ' &8| &#888888Negate Chance: &#00FF88{chance}%'
    - ''
    - ' &8| &aLeft-Click &#AAAAAAto upgrade'
    - ' &8| &aRight-Click &#AAAAAAto toggle'
    - ''

# =====================================================
# Efficiency Enchantment (Passive)
# =====================================================
# Increases mining speed via AttributeModifier.
# Speed bonus = level × SpeedPerLevel (applied silently, no event trigger).
Efficiency:
  Name: "Efficiency"
  Description: "Passively boosts your mining speed."
  Passive: true
  MaxLevel: 100
  MaxChance: 0
  Cost: 15
  Item: IRON_PICKAXE
  Texture: "http://textures.minecraft.net/texture/9169e85a8a4fca5c595a9d293f5ddf1068dc6db99f0700dd4d5b673865501a67"
  Lore:
    - ' {rarity}'
    - ''
    - ' &#FFFFFF&lDescription'
    - ' &8| &#CCCCCCPassively increases your mining'
    - ' &8| &#CCCCCCspeed based on enchant level.'
    - ''
    - ' &#FFFFFF&lStatistics'
    - ' &8| &#888888Level: &#FFFFFF{level}&#888888/&#FFFFFF{maxLevel}'
    - ' &8| &#888888Cost: &#B366D9🔥 &#B366D9{cost}'
    - ' &8| &#888888Break Speed: &#00FF88{speed}'
    - ''
    - ' &8| &aLeft-Click &#AAAAAAto upgrade'
    - ' &8| &aRight-Click &#AAAAAAto toggle'
    - ''
  # Speed multiplier per level (0.08 = 8% per level)
  # Level 1 = 8%, Level 50 = 400%, Level 100 = 800%
  SpeedPerLevel: 0.08

# =====================================================
# Furnace Enchantment (Active)
# =====================================================
# Chance to auto-smelt blocks based on configured recipes.
# Works with Alchemy-upgraded blocks via chained metadata.
Furnace:
  Name: "Furnace"
  Description: "Auto-smelts mined blocks into ingots."
  MaxLevel: 100
  MaxChance: 40
  Cost: 25
  Item: FURNACE
  Texture: "http://textures.minecraft.net/texture/33033f1b6ff1206503dfbde0e45e7556feffd8dfe7f57c2f9ee1f683644bd53d"
  Lore:
    - ' {rarity}'
    - ''
    - ' &#FFFFFF&lDescription'
    - ' &8| &#CCCCCCChance to automatically smelt'
    - ' &8| &#CCCCCCmined blocks into refined goods.'
    - ''
    - ' &#FFFFFF&lStatistics'
    - ' &8| &#888888Level: &#FFFFFF{level}&#888888/&#FFFFFF{maxLevel}'
    - ' &8| &#888888Cost: &#B366D9🔥 &#B366D9{cost}'
    - ' &8| &#888888Chance: &#00FF88{chance}%'
    - ''
    - ' &8| &aLeft-Click &#AAAAAAto upgrade'
    - ' &8| &aRight-Click &#AAAAAAto toggle'
    - ''
  Hologram:
    Enabled: true
    Message: "&#F0F0F0%original% &a> &#00FFFF%smelt%"
  # Smelting recipes: ORIGINAL -> RESULT
  Recipes:
    COBBLESTONE: STONE
    STONE: SMOOTH_STONE
    RAW_IRON: IRON_INGOT
    RAW_GOLD: GOLD_INGOT
    RAW_COPPER: COPPER_INGOT
    SAND: GLASS
    CLAY_BALL: BRICK
    NETHERRACK: NETHER_BRICK
    ANCIENT_DEBRIS: NETHERITE_SCRAP

# =====================================================
# Frostbite Enchantment (Active)
# =====================================================
# Chance to freeze blocks in a radius around the mined block,
# converting them to PACKED_ICE with their original material stored in metadata.
Frostbite:
  Name: "Frostbite"
  Description: "Freezes nearby blocks into packed ice."
  MaxLevel: 100
  MaxChance: 15
  Cost: 50
  Item: PACKED_ICE
  Texture: "http://textures.minecraft.net/texture/82da68bbc9bd4ccbc6dac39dfde5db5b0bca8358224b4df3fbf0fb6f37bf7499"
  Lore:
    - ' {rarity}'
    - ''
    - ' &#FFFFFF&lDescription'
    - ' &8| &#CCCCCCChance to freeze nearby blocks,'
    - ' &8| &#CCCCCCconverting them to packed ice.'
    - ''
    - ' &#FFFFFF&lStatistics'
    - ' &8| &#888888Level: &#FFFFFF{level}&#888888/&#FFFFFF{maxLevel}'
    - ' &8| &#888888Cost: &#B366D9🔥 &#B366D9{cost}'
    - ' &8| &#888888Chance: &#00FF88{chance}%'
    - ''
    - ' &8| &aLeft-Click &#AAAAAAto upgrade'
    - ' &8| &aRight-Click &#AAAAAAto toggle'
    - ''
  # Freeze radius (1 = 3×3×3, 2 = 5×5×5)
  Radius: 1
  Hologram:
    Enabled: true
    DefaultEnabled: false
    Message: "&#F0F0F0Froze &#00FFFF%blocks% &#F0F0F0blocks!"

# =====================================================
# Alchemy Enchantment (Active)
# =====================================================
# Chance to upgrade mined blocks to a higher-tier material.
# Runs at NORMAL event priority so Furnace (HIGH) can chain off the result.
Alchemy:
  Name: "Alchemy"
  Description: "Upgrades mined ores to higher-tier materials."
  MaxLevel: 100
  MaxChance: 20
  Cost: 100
  Item: BREWING_STAND
  Texture: "http://textures.minecraft.net/texture/1914e53c7dfa79b3e0ab03aa823b9e763cace240dabb14d9f327a225ce4415e3"
  Lore:
    - ' {rarity}'
    - ''
    - ' &#FFFFFF&lDescription'
    - ' &8| &#CCCCCCChance to upgrade mined blocks'
    - ' &8| &#CCCCCCto a higher-tier material.'
    - ''
    - ' &#FFFFFF&lStatistics'
    - ' &8| &#888888Level: &#FFFFFF{level}&#888888/&#FFFFFF{maxLevel}'
    - ' &8| &#888888Cost: &#B366D9🔥 &#B366D9{cost}'
    - ' &8| &#888888Chance: &#00FF88{chance}%'
    - ''
    - ' &8| &aLeft-Click &#AAAAAAto upgrade'
    - ' &8| &aRight-Click &#AAAAAAto toggle'
    - ''
  Hologram:
    Enabled: true
    Message: "&#F0F0F0%original% &a> &#00FFFF%upgrade%"
  # Upgrade recipes: ORIGINAL -> UPGRADED
  Upgrades:
    COBBLESTONE: COAL
    COAL: RAW_IRON
    RAW_IRON: RAW_GOLD
    RAW_GOLD: DIAMOND
    RAW_COPPER: RAW_IRON
    STONE: IRON_ORE
    IRON_ORE: GOLD_ORE
    GOLD_ORE: DIAMOND_ORE

# =====================================================
# Scavenger Enchantment (Active)
# =====================================================
# Chance to discover extra backpack slots while mining.
# SlotsMin/SlotsMax control the range found per trigger.
# MaxTotalSlots caps the backpack size so it can't grow indefinitely.
Scavenger:
  Name: "Scavenger"
  Description: "Discovers extra backpack slots while mining."
  MaxLevel: 100
  MaxChance: 15
  Cost: 20
  Item: CHEST
  Texture: "http://textures.minecraft.net/texture/9a17f3e16f2e0b3ce3a54b334cfd1f6f8c68c4ca1f1b6d8b2e4b16c8b0a2a4f"
  Lore:
    - ' {rarity}'
    - ''
    - ' &#FFFFFF&lDescription'
    - ' &8| &#CCCCCCChance to discover extra backpack'
    - ' &8| &#CCCCCCslots while mining.'
    - ''
    - ' &#FFFFFF&lStatistics'
    - ' &8| &#888888Level: &#FFFFFF{level}&#888888/&#FFFFFF{maxLevel}'
    - ' &8| &#888888Cost: &#B366D9🔥 &#B366D9{cost}'
    - ' &8| &#888888Chance: &#00FF88{chance}%'
    - ''
    - ' &8| &aLeft-Click &#AAAAAAto upgrade'
    - ' &8| &aRight-Click &#AAAAAAto toggle'
    - ''
  Hologram:
    Enabled: true
    Message: "&#00FFFF+%slots% &#F0F0F0Backpack Slots!"
  # Slots found per trigger (random between min and max)
  SlotsMin: 1
  SlotsMax: 3
  # Hard cap on total backpack size gained through Scavenger
  MaxTotalSlots: 100000

# =====================================================
# Merchant Enchantment (Active)
# =====================================================
# Chance to find coins while mining.
# Coin amount is random between CoinsMin and CoinsMax per trigger.
# Chance = (level / MaxLevel) * MaxChance
Merchant:
  Name: "Merchant"
  Description: "Find coins while mining."
  MaxLevel: 100
  MaxChance: 10
  Cost: 30
  Item: GOLD_NUGGET
  Texture: "http://textures.minecraft.net/texture/5768b8d5b3c6e16bc31de9b85f83d9bfb22fc01d52ddcda48d0d0fd5f7f5c4a3"
  Lore:
    - ' {rarity}'
    - ''
    - ' &#FFFFFF&lDescription'
    - ' &8| &#CCCCCCChance to discover coins'
    - ' &8| &#CCCCCCwhile mining.'
    - ''
    - ' &#FFFFFF&lStatistics'
    - ' &8| &#888888Level: &#FFFFFF{level}&#888888/&#FFFFFF{maxLevel}'
    - ' &8| &#888888Cost: &#B366D9🔥 &#B366D9{cost}'
    - ' &8| &#888888Chance: &#00FF88{chance}%'
    - ''
    - ' &8| &aLeft-Click &#AAAAAAto upgrade'
    - ' &8| &aRight-Click &#AAAAAAto toggle'
    - ''
  Hologram:
    Enabled: true
    Message: "&#FFD700+%coins% ⛁ Coins!"
  # Coins found per trigger (random between min and max)
  CoinsMin: 1
  CoinsMax: 50
