# =====================================================
# Evolv3 - Default Configuration
# =====================================================
# Core plugin settings including database, pickaxe system,
# and block values. All editable values are configurable.
# =====================================================

# =====================================================
# Scoreboard Configuration
# =====================================================
# The sidebar scoreboard shown to all online players.
# Supports color codes (&/&#RRGGBB) in Title and Lines.
#
# Lines support any PlaceholderAPI placeholder (%identifier_placeholder%)
# as well as color codes (&/&#RRGGBB).
# Evolv3 placeholders: %evolv3_player_name%, %evolv3_player_essence%,
#   %evolv3_player_coins%, %evolv3_pickaxe_level%, %evolv3_pickaxe_xp%,
#   %evolv3_pickaxe_target%, %evolv3_pickaxe_evolution_atoms%,
#   %evolv3_pickaxe_essence%, %evolv3_pickaxe_target_essence%
# Any other installed PAPI expansion works too (e.g. %player_name%).
#
# UpdateIntervalTicks: how often lines refresh (20 = 1 second)
# Maximum 15 lines (Minecraft sidebar limit).
# =====================================================
Scoreboard:
  Enabled: true
  Title: "&#00AFA3&lEvolve &7(0/20)"
  UpdateIntervalTicks: 5
  # Seconds to display each phase (Evo and Atoms) before animating to the other
  EvoAtomToggleSeconds: 5
  # Text shown on the evo line during the atoms phase. Supports PlaceholderAPI.
  EvoAtomToggleText: "&#FFEE00⚛ &#FFEE00%evolv3_pickaxe_evolution_atoms%"
  Lines:
    - ""
    - " &#FFFFFF&l%evolv3_player_name%"
    - " &8| &#888888Rank: &cNull"
    - " &8| &#888888BP: &#FFFFFF%evolv3_player_backpack_items%&#888888/&#FFFFFF%evolv3_player_backpack_size%"
    - "%evolv3_pickaxe_blank%"
    - " &#CCCCCCPickaxe &8(&#00FFFF&lEvo %evolv3_pickaxe_evolution%&8)"
    - " &8| &#888888Level: &#FFFFFF%evolv3_pickaxe_level%      &#00FF88%evolv3_pickaxe_percentage%"
    - " &8| %evolv3_pickaxe_progressbar% &7&7 "
    - ""
    - " &#CCCCCCWallet"
    - " &8| &#FFD700⛁ %evolv3_player_coins% &#B366D9  🔥 %evolv3_player_essence%"
    - ""
    - " &7play.evolvemc.net"

# Database connection string
Database:
  MongoDB: "mongodb+srv://<user>:<password>@<cluster>.mongodb.net/"

# =====================================================
# WorldGuard Region Settings
# =====================================================
# Region keyword to identify mine areas
# Only regions containing this keyword will allow pickaxe progression
MineRegion: "mine"

# Message shown when mining outside a mine region
NotInMineRegionMessage: "&#FFFFFF&lMINE REGION ONLY!"

# Schedule intervals (in ticks, 20 ticks = 1 second)
Schedules:
  PickaxeCheck:
    IntervalTicks: 100  # 5 seconds

# =====================================================
# Pickaxe Configuration
# =====================================================
Pickaxe:
  # Default values for new pickaxes
  Defaults:
    Level: 1
    XP: 0
    Target: 100
    EssenceTarget: 100         # Starting essence target
    CurrentEssence: 0
    EvolutionInterval: 30
    EnchantRolls: 0
    EvolutionAtoms: 0
    XPMultiplier: 1.15
    EssenceMultiplier: 1.5     # Multiplied per roll (100 → 150 → 225 → ...)
    EssenceTargetCap: 10000    # Maximum essence target

  # Durability warning threshold (percentage of remaining durability, e.g. 10 = warn below 10%)
  DurabilityWarningThreshold: 10

  # Progress bar visual elements
  Progressbar Symbol 1: "&#00FF88▄"
  Progressbar Symbol 2: "&#444444▄"

  # Pickaxe display name (supports PlaceholderAPI)
  Name: '&#00FFFF⛏ &#FFFFFF&l%evolv3_player_name% &#00FFFFPickaxe'

  # Action bar displayed while mining
  ActionBar: '&#00FFFF⭐ &#FFFFFF&lLevel &#00FFFF%evolv3_pickaxe_level% &#00FFFF📊 &#FFFFFF&lXP &#00FFFF%evolv3_pickaxe_xp%&#888888/&#00FFFF%evolv3_pickaxe_target%'

  # Main lore template - uses PlaceholderAPI placeholders
  # %evolv3_pickaxe_enchants% is replaced with the formatted enchant list
  Lore:
    - ''
    - ' &#FFFFFF&lEnchantments'
    - ' %evolv3_pickaxe_enchants%'
    - ''
    - ' &#FFFFFF&lStatistics'
    - ' &8| &#00FFFFLevel: &#FFFFFF%evolv3_pickaxe_level%'
    - ' &8| &#00FFFFXP: &#FFFFFF%evolv3_pickaxe_xp%&#888888/&#FFFFFF%evolv3_pickaxe_target%'
    - ' &8| &#00FFFFProgress: &#00FF88%evolv3_pickaxe_percentage%'
    - ' &8| %evolv3_pickaxe_progressbar%'

  # Footer lore (usage instructions)
  LoreFooter:
    - ''
    - ' &8| &aRight-Click &#AAAAAAto open menu'
    - ''

  # XP Hologram settings (displayed when mining blocks)
  Hologram:
    Enabled: true
    Text: '&#00FFFF+ %xp% &#FFFFFF&lXP'

# =====================================================
# Player Configuration
# =====================================================
Player:
  Defaults:
    # Starting pickaxe slot limit (0 = no slots; player must mine wood to earn the first slot)
    # Can be set to any value between 0 and PickaxeLimitMenu.MAX_SLOTS (currently 7)
    PickaxeLimit: 0
    # Starting essence amount for new players
    Essence: 0
    # Starting coin balance for new players
    Coins: 0.0

# =====================================================
# Armor Configuration
# =====================================================
# Armor pieces level up through different activities:
# - Helmet: Selling blocks (increases sell price multiplier)
# - Chestplate: Collecting essence (increases essence gain multiplier)
# - Leggings: Mining blocks (increases pickaxe XP multiplier)
# - Boots: Walking (increases movement speed)
Armor:
  Defaults:
    Level: 1
    XP: 0
    Target: 100
    Multiplier: 1.0
    XPMultiplier: 1.1
    MultiplierIncrement: 0.05
    EvolutionInterval: 30

  # ────────────────── HELMET ──────────────────
  # Levels up through selling blocks
  # Provides: Sell multiplier bonus
  Helmet:
    Name: '&#00FFFF💰 &#FFFFFF&l%evolv3_player_name% &#00FFFFHelmet'
    Lore:
      - ''
      - ' &#FFFFFF&lDescription'
      - ' &#CCCCCCLevel up by selling blocks'
      - ' &#CCCCCCIncreases your sell multiplier'
      - ''
      - ' &#FFFFFF&lStatistics'
      - ' &#00FFFF💰 Sell Multiplier: &#00FFFF%evolv3_player_armor_helmet_multiplier%x'
      - ' &#00FFFF⭐ Level: &#FFFFFF%evolv3_player_armor_helmet_level%'
      - ' &#00FFFF📊 XP: &#FFFFFF%evolv3_player_armor_helmet_xp%&#888888/&#FFFFFF%evolv3_player_armor_helmet_target%'
      - ' &#00FFFF📈 Progress: &#00FF88%evolv3_player_armor_helmet_percentage%'
      - ' %evolv3_player_armor_helmet_progressbar%'
      - ''
      - ' &#AAAAAA→ Left click to manage'
      - ''

  # ────────────────── CHESTPLATE ──────────────────
  # Levels up through collecting essence
  # Provides: Essence multiplier bonus
  Chestplate:
    Name: '&#9932CC🔥 &#FFFFFF&l%evolv3_player_name% &#9932CCChestplate'
    Lore:
      - ''
      - ' &#FFFFFF&lDescription'
      - ' &#CCCCCCLevel up by collecting essence'
      - ' &#CCCCCCIncreases your essence multiplier'
      - ''
      - ' &#FFFFFF&lStatistics'
      - ' &#9932CC🔥 Essence Multiplier: &#00FFFF%evolv3_player_armor_chestplate_multiplier%x'
      - ' &#00FFFF⭐ Level: &#FFFFFF%evolv3_player_armor_chestplate_level%'
      - ' &#00FFFF📊 XP: &#FFFFFF%evolv3_player_armor_chestplate_xp%&#888888/&#FFFFFF%evolv3_player_armor_chestplate_target%'
      - ' &#00FFFF📈 Progress: &#00FF88%evolv3_player_armor_chestplate_percentage%'
      - ' %evolv3_player_armor_chestplate_progressbar%'
      - ''
      - ' &#AAAAAA→ Left click to manage'
      - ''

  # ────────────────── LEGGINGS ──────────────────
  # Levels up through mining blocks
  # Provides: XP multiplier bonus
  Leggings:
    Name: '&#FF6B35📊 &#FFFFFF&l%evolv3_player_name% &#FF6B35Leggings'
    Lore:
      - ''
      - ' &#FFFFFF&lDescription'
      - ' &#CCCCCCLevel up by mining blocks'
      - ' &#CCCCCCIncreases your XP multiplier'
      - ''
      - ' &#FFFFFF&lStatistics'
      - ' &#FF6B35📊 XP Multiplier: &#00FFFF%evolv3_player_armor_leggings_multiplier%x'
      - ' &#00FFFF⭐ Level: &#FFFFFF%evolv3_player_armor_leggings_level%'
      - ' &#00FFFF📊 XP: &#FFFFFF%evolv3_player_armor_leggings_xp%&#888888/&#FFFFFF%evolv3_player_armor_leggings_target%'
      - ' &#00FFFF📈 Progress: &#00FF88%evolv3_player_armor_leggings_percentage%'
      - ' %evolv3_player_armor_leggings_progressbar%'
      - ''
      - ' &#AAAAAA→ Left click to manage'
      - ''

  # ────────────────── BOOTS ──────────────────
  # Levels up through walking/movement
  # Provides: Movement speed bonus
  Boots:
    Name: '&#00BFFF🏃 &#FFFFFF&l%evolv3_player_name% &#00BFFFBoots'
    Lore:
      - ''
      - ' &#FFFFFF&lDescription'
      - ' &#CCCCCCLevel up by walking (1 XP per 5 blocks)'
      - ' &#CCCCCCIncreases your speed'
      - ''
      - ' &#FFFFFF&lStatistics'
      - ' &#00BFFF🏃 Speed Multiplier: &#00FFFF%evolv3_player_armor_boots_multiplier%x'
      - ' &#00FFFF⭐ Level: &#FFFFFF%evolv3_player_armor_boots_level%'
      - ' &#00FFFF📊 XP: &#FFFFFF%evolv3_player_armor_boots_xp%&#888888/&#FFFFFF%evolv3_player_armor_boots_target%'
      - ' &#00FFFF📈 Progress: &#00FF88%evolv3_player_armor_boots_percentage%'
      - ' %evolv3_player_armor_boots_progressbar%'
      - ''
      - ' &#AAAAAA→ Left click to manage'
      - ''

# =====================================================
# Ancient Resin Configuration
# =====================================================
AncientResin:
  # Percentage chance (0-100) that breaking any log drops one Ancient Resin
  DropChance: 25.0
  # Number of Ancient Resin required to fully repair a pickaxe
  RepairCost: 5

# =====================================================
# Pickaxe Storage Configuration
# =====================================================
PickaxeStorage:
  # Maximum number of unlockable pickaxe slots (cannot exceed 7 — the GUI layout limit)
  MaxSlots: 7
  # Base log cost for the first slot
  BaseCost: 32
  # Cost multiplier per slot (slot 2 = 32*1.5=48, slot 3 = 32*1.5*1.5=72, etc.)
  CostMultiplier: 1.5
  # Log type required to unlock each slot (index 0 = first slot, 1 = second, etc.)
  # Must have at least MaxSlots entries. Accepts any valid Material name.
  # Log cost (any log type) for a full pickaxe repair
  RepairCost: 10
  # Maximum pickaxes a player may claim within the window (anti-exploit)
  MaxClaimsPerWindow: 5
  # Duration of the claim rate-limit window in minutes
  ClaimWindowMinutes: 5
  Slots:
    - OAK_LOG
    - SPRUCE_LOG
    - BIRCH_LOG
    - JUNGLE_LOG
    - ACACIA_LOG
    - DARK_OAK_LOG
    - MANGROVE_LOG

# =====================================================
# Backpack Configuration
# =====================================================
Backpack:
  # Maximum number of unique item stacks
  Size: 100
  # Backpack display name (supports PlaceholderAPI)
  Name: '&#8B4513🎒 &#FFFFFF&l%evolv3_player_name% &#8B4513Backpack'
  # Message when backpack is full
  FullMessage: '&#FF4444&lBACKPACK FULL &#AAAAAA- &#FFFFFF&lSELL ITEMS'
  # Backpack item lore (supports placeholders)
  Lore:
    - ''
    - ' &#FFFFFF&lInventory'
    - ' &#00FFFF📦 Items: &#FFFFFF%evolv3_player_backpack_items%'
    - ' &#00FFFF📊 Size: &#FFFFFF%evolv3_player_backpack_size%'
    - ''
    - ' &#AAAAAA→ Left click to manage'
    - ''
  # Custom model data for the backpack item (resource pack)
  CustomModelData: 2
  # Hologram displayed when items are added to backpack
  Hologram:
    Enabled: true
    Text: '&f+ %amount% &7%block% &8(&a%xp% xp&8)'

# =====================================================
# Essence Configuration
# =====================================================
Essence:
  # Random essence discovery while mining
  DiscoveryChance: 10.0
  DiscoveryMinAmount: 5
  DiscoveryMaxAmount: 20

  # Level-up essence reward settings
  LevelUpRewards:
    # Increment per level (Level 1=1-10, Level 2=11-20, etc.)
    TierIncrement: 10
    # Maximum essence that can be awarded per level-up
    MaxCap: 1000

  # Hologram settings for essence discovery notifications
  Hologram:
    Enabled: true
    Text: '&#B366D9🔥 &#FFFFFF&l+ %amount% &#B366D9Essence'

# =====================================================
# Atom Configuration
# =====================================================
# Atoms are rare materials discovered while mining that
# fuel your pickaxe's evolution to the next stage.
# They are much rarer than essence and highly rewarding.
# =====================================================
Atoms:
  # Rare random atom discovery while mining (percentage, e.g. 1.0 = 1%)
  DiscoveryChance: 2.5
  DiscoveryMinAmount: 1
  DiscoveryMaxAmount: 3

  # Atoms awarded per pickaxe level-up
  LevelUpReward: 2

  # Starting atom target (atoms needed for first evolution roll)
  DefaultTarget: 100

  # Multiplier applied to atom target after each evolution roll (100 → 300 → 900 → ...)
  TargetMultiplier: 3.0

  # Hologram settings for atom discovery notifications
  Hologram:
    Enabled: true
    Text: '&#FFEE00⚛ &#FFFFFF&l+ %amount% &#FFEE00Atoms'

