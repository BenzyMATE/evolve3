# Mine Configuration
# =============================================================================
# Mines are cuboid regions that fill with configurable block compositions,
# reset on a timer or when a percentage threshold is mined, and optionally
# generate cave structures in the surrounding walls.

# ---- Global Defaults ----
# These apply to every mine unless overridden per-mine.

defaults:
  # How often the mine auto-resets (in minutes). Set to 0 to disable timed resets.
  reset-interval: 5

  # The mine auto-resets when this percentage of blocks have been mined.
  # Set to 0 to disable percentage-based resets.
  reset-percentage: 90

  # Warning (in seconds before reset) — broadcasts to players inside the mine.
  reset-warning: 10

  # Whether to teleport players to the mine spawn point on reset.
  teleport-on-reset: true

  # Number of cave schematics to paste into the surrounding walls per reset.
  # Set to 0 to disable cave generation entirely.
  cave-count: 4

  # Minimum distance (in blocks) between cave entrances.
  cave-min-distance: 20

  # Whether to display a floating TextDisplay hologram above each mine.
  hologram-enabled: true

  # Y offset above the mine's top surface for the hologram.
  hologram-offset-y: 14

  # Scale multiplier for the hologram text (1.0 = default tiny, 4.0 = large).
  hologram-scale: 4.0

  # Default icon displayed before the mine name in the hologram title.
  # Can be overridden per-mine with /mine hologram icon <name> <icon>.
  hologram-icon: "⛏"

# ---- Cave Tier Reward Tables ----
# Tiers 1–4 define how many items appear and what rewards are available.
# Per-mine tier is stored in localdata/mines-data.yml (cave-tier field, default 1).
# Weights are relative — they do not need to sum to 100.
# Supported types: MONEY, RESIN, EVOLUTION_STONE, ENCHANT_ROLL, PICKAXE_XP,
#                  BACKPACK_SLOTS, ESSENCE, ATOMS
