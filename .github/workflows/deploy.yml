# .github/workflows/deploy.yml
# Builds the plugin on every push to master, uploads the jar via SFTP to the
# Pterodactyl (WitherPanel) file daemon, pings the DeployWebhook plugin to
# hot-reload it, then (when resource-pack/ changed) uploads the raw assets to
# MythicMobs' merge folder via SFTP, packages the resource pack, publishes it
# to a rolling GitHub Release, and updates server.properties over the same
# SFTP creds.

name: Build & Deploy Plugin

on:
  push:
    branches: [ master ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # needed to publish the resource pack release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'      # matches Paper 26.x
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B clean package
        # Make sure your pom has <finalName>evolve3</finalName> so the jar
        # name is stable and overwrites cleanly each deploy.

      - name: List built jars
        run: ls -la target/Evolv3.jar

      # --- DEPLOY: pure-SFTP upload into the server's plugins folder ---
      - name: Upload plugin jar via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          server: 'nl-3.panelapi.net'
          port: '2022'
          username: ${{ secrets.SFTP_USERNAME }}    # full name.serverid format
          password: ${{ secrets.SFTP_PASSWORD }}
          sftp_only: true                            # Pterodactyl has no SSH shell
          local_path: './target/Evolv3.jar'
          remote_path: '/plugins'

      # =================================================================
      # RESOURCE PACK — only runs when files under resource-pack/ changed
      # =================================================================
      - name: Check for resource pack changes
        id: pack-changes
        run: |
          if git diff --quiet ${{ github.event.before }} ${{ github.sha }} -- resource-pack/ 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # 1. Zip the pack contents (pack.mcmeta must end up at the zip root)
      - name: Package resource pack
        if: steps.pack-changes.outputs.changed == 'true'
        run: |
          cd resource-pack
          zip -r ../pack.zip . -x '.*'
          cd ..
          echo "PACK_SHA1=$(sha1sum pack.zip | cut -d' ' -f1)" >> "$GITHUB_ENV"

      # 1b. Push the raw asset files into MythicMobs' resource pack merge
      #     folder so its generator picks them up on the next model reload.
      #     This action's sftp `put -r` nests the local dir's own basename
      #     under remote_path, so pointing remote_path at .../merge (the
      #     parent) is what lands the contents at .../merge/assets, not
      #     .../merge/assets/assets.
      - name: Upload resource pack assets via SFTP
        if: steps.pack-changes.outputs.changed == 'true'
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          server: 'nl-3.panelapi.net'
          port: '2022'
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          sftp_only: true
          local_path: './resource-pack/assets'
          remote_path: '/plugins/MythicMobs/generation/merge'

      # 2. Host it on a rolling GitHub Release with a fixed tag
      - name: Publish pack to release
        if: steps.pack-changes.outputs.changed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: resource-pack-latest
          name: Resource Pack (latest)
          files: pack.zip
          overwrite_files: true
          repository: BenzyMATE/evolve3-pack
          token: ${{ secrets.PACK_REPO_TOKEN }}

      # 3. Pull server.properties, edit, push back — same SFTP creds as above
      - name: Update server.properties via SFTP
        if: steps.pack-changes.outputs.changed == 'true'
        env:
          SFTP_USER: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASS: ${{ secrets.SFTP_PASSWORD }}
          PACK_URL: https://github.com/BenzyMATE/evolve3-pack/releases/download/resource-pack-latest/pack.zip
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          lftp -u "$SFTP_USER","$SFTP_PASS" -p 2022 sftp://nl-3.panelapi.net \
            -e "set sftp:auto-confirm yes; get /server.properties -o server.properties; bye"

          update_key() {
            if grep -q "^$1=" server.properties; then
              sed -i "s|^$1=.*|$1=$2|" server.properties
            else
              echo "$1=$2" >> server.properties
            fi
          }
          update_key resource-pack "$PACK_URL"
          update_key resource-pack-sha1 "$PACK_SHA1"

          lftp -u "$SFTP_USER","$SFTP_PASS" -p 2022 sftp://nl-3.panelapi.net \
            -e "set sftp:auto-confirm yes; put server.properties -o /server.properties; bye"

      # --- RELOAD: tell the DeployWebhook plugin to swap in the new jar ---
      # Commit message is passed as the request body and the commit hash as a
      # header, so the plugin can bump its MOTD's version (major.minor-hash) and
      # display both. github.event.head_commit.message is attacker-influenceable,
      # so it's passed via `env:` rather than interpolated straight into the
      # script, per GitHub's script-injection guidance. github.sha is a plain hex
      # string and safe to interpolate directly.
      - name: Trigger plugin hot-reload
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          curl --fail --show-error --silent -X POST \
            "http://play.evolvemc.net:${{ secrets.WEBHOOK_PORT }}/deploy" \
            -H "Authorization: Bearer ${{ secrets.WEBHOOK_TOKEN }}" \
            -H "Content-Type: text/plain; charset=utf-8" \
            -H "X-Commit-Hash: ${{ github.sha }}" \
            --data-binary "$COMMIT_MESSAGE"