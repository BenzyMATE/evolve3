# .github/workflows/deploy.yml
# Builds the plugin on every push to main, uploads the jar via SFTP to the
# Pterodactyl (WitherPanel) file daemon, then pings the DeployWebhook plugin
# to hot-reload it. No panel API or SSH shell required.

name: Build & Deploy Plugin

on:
  push:
    branches: [ master ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'      # matches Paper 26.x
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B clean package
        # Make sure your pom has <finalName>evolve3</finalName> so the jar
        # name is stable and overwrites cleanly each deploy.

      # --- DEPLOY: pure-SFTP upload into the server's plugins folder ---
      - name: Upload plugin jar via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          server: 'nl-3.panelapi.net'
          port: '2022'
          username: ${{ secrets.SFTP_USERNAME }}    # full name.serverid format
          password: ${{ secrets.SFTP_PASSWORD }}
          sftp_only: true                            # Pterodactyl has no SSH shell
          local_path: './target/evolve3.jar'         # must match your finalName
          remote_path: '/plugins'

      # --- RELOAD: tell the DeployWebhook plugin to swap in the new jar ---
      # play.evolvemc.net resolves to your server IP; the port here is the
      # EXTRA allocation you assigned to DeployWebhook in the panel Network tab.
      - name: Trigger plugin hot-reload
        run: |
          curl --fail --show-error --silent -X POST \
            "http://play.evolvemc.net:${{ secrets.WEBHOOK_PORT }}/deploy" \
            -H "Authorization: Bearer ${{ secrets.WEBHOOK_TOKEN }}"
