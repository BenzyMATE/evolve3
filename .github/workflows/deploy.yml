# .github/workflows/deploy.yml
# Builds the plugin, uploads it via SFTP (Pterodactyl file daemon),
# then restarts the server through the WitherPanel (Pterodactyl) Client API.

name: Build & Deploy Plugin

on:
  push:
    branches: [ master ]

env:
  SERVER_ID: 7140e993   # your Pterodactyl server identifier - verify in panel URL

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'    # was 21 — Paper 26.x requires Java 25
          cache: 'maven'

      - name: Build with Maven
        run: mvn -B clean package
        # Gradle alternative: run: ./gradlew build

      # --- DEPLOY: pure-SFTP upload (no shell/SCP available on Pterodactyl) ---
      - name: Upload plugin jar via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.5
        with:
          server: 'nl-3.panelapi.net'
          port: '2022'
          username: ${{ secrets.SFTP_USERNAME }}   # e.g. yourname.7140e993
          password: ${{ secrets.SFTP_PASSWORD }}
          sftp_only: true                          # IMPORTANT: no SSH shell exists
          local_path: './target/upload/Evolv3.jar'
          remote_path: '/plugins'

      # --- RESTART: send power signal through the panel's Client API ---
      - name: Restart server via panel API
        run: |
          curl --fail -X POST \
            "https://witherpanel.com/api/client/servers/${SERVER_ID}/power" \
            -H "Authorization: Bearer ${{ secrets.PANEL_API_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Accept: Application/vnd.pterodactyl.v1+json" \
            -d '{"signal": "restart"}'
